<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07143c"><link rel="manifest" href="manifest.webmanifest"><title>100 Flag Challenge</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#020817;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:grid;place-items:center}.app{width:min(100vw,56.25vh);height:min(100vh,177.78vw);aspect-ratio:9/16;padding:4%;display:flex;flex-direction:column;gap:2%;background:radial-gradient(circle at 50% 35%,#16b7a955,transparent 25%),linear-gradient(155deg,#07143c,#0c48a0 60%,#42116f);box-shadow:0 0 60px #000}.top{height:9%;display:grid;grid-template-columns:62px 1fr 65px;align-items:center}.num{width:52px;height:52px;border:4px solid #20d9ff;border-radius:50%;display:grid;place-items:center;font:900 25px Impact}.level{font:900 11px Impact;text-align:center;margin-top:2px}.easy{color:#2cff79}.medium{color:#ffd867}.hard{color:#ff5151}.title{text-align:center;font:900 clamp(21px,5vw,35px)/.9 Impact;text-transform:uppercase;text-shadow:0 4px 8px #000}.score{text-align:right;font:900 25px Impact}.score small{display:block;font:900 9px Arial;letter-spacing:1px}.controls{height:5%;display:flex;justify-content:center;gap:5px}.controls button{border:1px solid #ffffff40;border-radius:8px;padding:5px 8px;background:#06133a;color:white;font-weight:900;font-size:10px}.controls .start{background:#18c867}.controls .stop{background:#e83d50}.controls .install{background:#ffd13b;color:#09205d}.badge{align-self:center;background:#ffc928;color:#08205d;border-radius:6px;padding:4px 12px;font:900 14px Impact;text-transform:uppercase}.timer{height:16px;background:#03050a;border-radius:10px;padding:4px}.fill{height:100%;width:100%;border-radius:7px;background:#29ed63}.flagbox{height:29%;border:5px solid white;border-radius:18px;background:#f8fbff;display:grid;place-items:center;overflow:hidden;box-shadow:0 10px 25px #0008}.flagbox img{width:86%;height:84%;object-fit:contain}.answers{height:31%;display:grid;grid-template-rows:repeat(3,1fr);gap:7%}.ans{display:grid;grid-template-columns:53px 1fr;align-items:center;background:none;border:0;padding:0}.key{z-index:2;width:53px;height:53px;border:4px solid #050505;border-radius:50%;display:grid;place-items:center;color:#fff;font:900 27px Impact}.ans:nth-child(1) .key{background:#1fe06a}.ans:nth-child(2) .key{background:#ff8a00}.ans:nth-child(3) .key{background:#ff0a8a}.body{height:100%;margin-left:-8px;border:4px solid #050505;border-radius:17px;background:#fff;color:#0b0e18;display:grid;place-items:center;padding-left:14px;text-align:center;text-transform:uppercase;font:900 clamp(13px,2.8vw,20px) Impact}.correct .body{background:#baffd0}.wrong .body{background:#ffd0d4;opacity:.6}.bottom{font-size:10px;font-weight:bold;display:flex;justify-content:space-between}.count{font:900 17px Impact}.overlay,.end{position:absolute;inset:0;background:#020817dd;display:none;place-items:center;text-align:center;z-index:10}.card{background:#071842;padding:25px;border-radius:20px}.card h2{font:900 36px Impact;margin:0 0 10px}.end h2{font:900 42px Impact;margin:10px}.end button,.card button{padding:10px 18px;border:0;border-radius:9px;background:#22d86e;font-weight:900}</style></head><body><div class="app"><div class="top"><div><div id="num" class="num">1</div><div id="level" class="level easy">EASY</div></div><div class="title">Guess the Flag</div><div id="score" class="score"><small>SCORE</small>0</div></div><div class="controls"><button id="start" class="start">▶ Start</button><button id="stop" class="stop">⏸ Stop</button><button id="restart">↻ Restart</button><button id="install" class="install" hidden>⬇ Install</button></div><div class="badge">100 Flag Challenge</div><div class="timer"><div id="fill" class="fill"></div></div><div class="flagbox"><img id="flag"></div><div id="answers" class="answers"></div><div class="bottom"><span>Question <b id="progress">1</b>/100 · Easy 4s · Medium 3s · Hard 2s</span><span id="count" class="count">READY</span></div></div><div id="pause" class="overlay"><div class="card"><h2>Paused</h2><button onclick="startGame()">▶ Continue</button></div></div><div id="end" class="end"><div><div style="font-size:65px">🏆</div><h2>100 Flags Complete!</h2><p>Final score: <b id="final">0</b></p><button onclick="resetGame()">↻ Play Again</button></div></div><script>const F=[['United States','us'],['Canada','ca'],['United Kingdom','gb'],['France','fr'],['Germany','de'],['Italy','it'],['Spain','es'],['Japan','jp'],['China','cn'],['India','in'],['Brazil','br'],['Australia','au'],['New Zealand','nz'],['Mexico','mx'],['South Africa','za'],['Russia','ru'],['South Korea','kr'],['Indonesia','id'],['Saudi Arabia','sa'],['Turkey','tr'],['Argentina','ar'],['Switzerland','ch'],['Sweden','se'],['Norway','no'],['Denmark','dk'],['Finland','fi'],['Poland','pl'],['Netherlands','nl'],['Belgium','be'],['Austria','at'],['Ireland','ie'],['Portugal','pt'],['Greece','gr'],['Thailand','th'],['Vietnam','vn'],['Malaysia','my'],['Singapore','sg'],['Philippines','ph'],['Israel','il'],['United Arab Emirates','ae'],['Egypt','eg'],['Nigeria','ng'],['Jamaica','jm'],['Kenya','ke'],['Chile','cl'],['Colombia','co'],['Peru','pe'],['Venezuela','ve'],['Morocco','ma'],['Qatar','qa'],['Kuwait','kw'],['Algeria','dz'],['Ukraine','ua'],['Czech Republic','cz'],['Hungary','hu'],['Romania','ro'],['Bulgaria','bg'],['Croatia','hr'],['Serbia','rs'],['Uruguay','uy'],['Guatemala','gt'],['Costa Rica','cr'],['Tunisia','tn'],['Dominican Republic','do'],['Ecuador','ec'],['Bolivia','bo'],['Paraguay','py'],['Belarus','by'],['Ivory Coast','ci'],['Iceland','is'],['Uzbekistan','uz'],['Kazakhstan','kz'],['Ethiopia','et'],['Slovenia','si'],['Slovakia','sk'],['Lithuania','lt'],['Latvia','lv'],['Estonia','ee'],['Cyprus','cy'],['Bahrain','bh'],['Oman','om'],['Jordan','jo'],['Lebanon','lb'],['Armenia','am'],['Azerbaijan','az'],['Georgia','ge'],['Moldova','md'],['North Macedonia','mk'],['Montenegro','me'],['Malta','mt'],['Brunei','bn'],['Bhutan','bt'],['Maldives','mv'],['Nepal','np'],['Papua New Guinea','pg'],['Fiji','fj'],['Samoa','ws'],['Vanuatu','vu'],['Suriname','sr'],['Zimbabwe','zw']];let q=0,s=0,t=null,run=false,locked=false,left=0,total=4,deferred;const $=x=>document.getElementById(x);function settings(){if(q<35)return['EASY',4,'easy'];if(q<70)return['MEDIUM',3,'medium'];return['HARD',2,'hard']}function opts(){let a=[F[q][0]];while(a.length<3){let x=F[Math.floor(Math.random()*F.length)][0];if(!a.includes(x))a.push(x)}return a.sort(()=>Math.random()-.5)}function prep(){locked=false;let z=settings();$('num').textContent=q+1;$('progress').textContent=q+1;$('level').textContent=z[0];$('level').className='level '+z[2];$('flag').src='https://flagcdn.com/w640/'+F[q][1]+'.png';$('fill').style.width='100%';$('count').textContent='READY';$('answers').innerHTML='';opts().forEach((x,i)=>{let b=document.createElement('button');b.className='ans';b.innerHTML='<span class="key">'+['A','B','C'][i]+'</span><span class="body">'+x+'</span>';b.onclick=()=>choose(b,x);$('answers').appendChild(b)})}function startGame(){if(run)return;run=true;$('pause').style.display='none';let z=settings();total=z[1];if(left<=0)left=total;let st=performance.now(),base=left;t=setInterval(()=>{let used=(performance.now()-st)/1000;left=Math.max(0,base-used);$('fill').style.width=(left/total*100)+'%';$('count').textContent=left.toFixed(1)+'s';if(left<=0){clearInterval(t);run=false;choose(null,'')}},40)}function stopGame(){if(!run)return;run=false;clearInterval(t);$('pause').style.display='grid'}function choose(btn,x){if(locked)return;locked=true;clearInterval(t);run=false;document.querySelectorAll('.ans').forEach(b=>{let n=b.querySelector('.body').textContent;if(n===F[q][0])b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});if(x===F[q][0]){s++;$('score').innerHTML='<small>SCORE</small>'+s}setTimeout(()=>{q++;left=0;if(q>=100){$('final').textContent=s;$('end').style.display='grid'}else{prep();startGame()}},650)}function resetGame(){clearInterval(t);q=0;s=0;left=0;run=false;$('score').innerHTML='<small>SCORE</small>0';$('end').style.display='none';$('pause').style.display='none';prep()}$('start').onclick=startGame;$('stop').onclick=stopGame;$('restart').onclick=resetGame;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});$('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('install').hidden=true}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));prep();</script></body></html>
